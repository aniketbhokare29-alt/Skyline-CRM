<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skyline CRM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="support" data-title="Customer Support">
  <div id="shell"><div id="page">
    <div class="page-header"><div><h1>Customer Support</h1><p class="subtle">Log after-sales requests for maintenance, complaints, documentation, service requests, and referrals.</p></div></div>
    <form class="form" id="support-form" data-endpoint="support" data-redirect="support.html">
      <input type="hidden" name="id">
      <div class="form-grid">
        <label>Customer Name<input name="customer" required></label>
        <label>Unit Number<input name="unit"></label>
        <label>Booking ID<input name="bookingId"></label>
        <label>Ticket Number<input name="ticketNumber"></label>
        <label>Type<select name="type"><option>MAINTENANCE</option><option>COMPLAINT</option><option>SERVICE_REQUEST</option><option>DOCUMENTATION</option><option>REFERRAL</option></select></label>
        <label>Subject<input name="subject"></label>
        <label>Priority<select name="priority"><option>Normal</option><option>High</option><option>Urgent</option></select></label>
        <label>Status<select name="status"><option>OPEN</option><option>IN_PROGRESS</option><option>RESOLVED</option><option>CLOSED</option><option>CANCELLED</option></select></label>
        <label>Assigned To<input name="assignedTo"></label>
        <label>Created Date<input name="createdDate" type="date" data-default="today"></label>
        <label>Due Date<input name="dueDate" type="date"></label>
      </div>
      <label>Description<textarea name="description" placeholder="Customer issue, requested action, next step"></textarea></label>
      <label>Resolution<textarea name="resolution"></textarea></label>
      <button class="button" type="submit">Save Ticket</button>
    </form>
    <section class="section table-wrap"><table><thead><tr><th>Customer</th><th>Unit</th><th>Category</th><th>Priority</th><th>Status</th><th>Assigned To</th><th>Description</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></section>
  </div></div>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
