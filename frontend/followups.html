<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skyline CRM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="followups" data-title="Follow-ups">
  <div id="shell"><div id="page">
    <div class="page-header">
      <div>
        <h1>Follow-ups</h1>
        <p class="subtle">Record call, WhatsApp, email, SMS, meeting, or video follow-ups with next action date.</p>
      </div>
    </div>
    <form class="form" id="followup-form" data-endpoint="followups" data-redirect="followups.html">
      <input type="hidden" name="id">
      <div class="form-grid">
        <label>Customer Name<input name="customer" required></label>
        <label>Type<select name="type"><option>Phone Call</option><option>WhatsApp</option><option>Email</option><option>SMS</option><option>Meeting</option><option>Video Call</option></select></label>
        <label>Date<input name="date" type="date" data-default="today"></label>
        <label>Time<input name="time" type="time" data-default="time"></label>
        <label>Next Follow-up Date<input name="nextDate" type="date"></label>
        <label>Executive Name<input name="executive"></label>
      </div>
      <label>Remarks<textarea name="remarks"></textarea></label>
      <button class="button" type="submit">Save Follow-up</button>
    </form>
    <section class="section table-wrap">
      <table>
        <thead><tr><th>Customer</th><th>Type</th><th>Done On</th><th>Next Date</th><th>Executive</th><th>Remarks</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </div></div>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
