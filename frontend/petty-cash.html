<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skyline CRM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="petty-cash" data-title="Petty Cash">
  <div id="shell"><div id="page">
    <div class="page-header"><div><h1>Petty Cash</h1><p class="subtle">Record daily cash expenses, voucher details, category, employee, payment mode, and approver.</p></div></div>
    <section class="grid cards" id="cards"></section>
    <form class="form section" id="petty-cash-form" data-endpoint="petty-cash" data-redirect="petty-cash.html">
      <input type="hidden" name="id">
      <div class="form-grid">
        <label>Date<input name="date" type="date" data-default="today"></label>
        <label>Voucher Number<input name="voucherNumber" required></label>
        <label>Expense Category<select name="expenseCategory"><option>Office Expenses</option><option>Tea & Snacks</option><option>Fuel</option><option>Vehicle Maintenance</option><option>Courier</option><option>Stationery</option><option>Electricity</option><option>Internet</option><option>Marketing</option><option>Site Expenses</option><option>Labour Payment</option><option>Miscellaneous</option></select></label>
        <label>Employee Name<input name="employeeName"></label>
        <label>Amount<input name="amount"></label>
        <label>Payment Mode<select name="paymentMode"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Cheque</option></select></label>
        <label>Approved By<input name="approvedBy"></label>
      </div>
      <label>Description<textarea name="description"></textarea></label>
      <button class="button" type="submit">Save Cash Entry</button>
    </form>
    <section class="section table-wrap"><table><thead><tr><th>Date</th><th>Voucher</th><th>Category</th><th>Employee</th><th>Amount</th><th>Approved By</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></section>
  </div></div>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
