<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skyline CRM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="qualification" data-title="Lead Qualification">
  <div id="shell"><div id="page">
    <div class="page-header">
      <div>
        <h1>Lead Qualification</h1>
        <p class="subtle">Record customer budget, loan need, location, flat type, buying timeline, and qualification status.</p>
      </div>
    </div>
    <form class="form" id="qualification-form" data-endpoint="qualification" data-redirect="qualification.html">
      <input type="hidden" name="id">
      <div class="form-grid">
        <label>Customer Name<input name="customer" required></label>
        <label>Budget<input name="budget" placeholder="Example: 55L - 70L"></label>
        <label>Loan Required?
          <select name="loanRequired"><option>Yes</option><option>No</option><option>Not Sure</option></select>
        </label>
        <label>Preferred Location<input name="preferredLocation"></label>
        <label>Flat Type
          <select name="flatType"><option>1 BHK</option><option>2 BHK</option><option>3 BHK</option><option>4 BHK</option></select>
        </label>
        <label>Purchase Timeline
          <select name="purchaseTimeline"><option>Immediate</option><option>Within 1 Month</option><option>1 - 3 Months</option><option>3 - 6 Months</option><option>Future</option></select>
        </label>
        <label>Purpose
          <select name="purpose"><option>Self Use</option><option>Investment</option></select>
        </label>
        <label>Status
          <select name="status"><option>Qualified</option><option>Not Interested</option><option>Future Prospect</option><option>Wrong Number</option><option>Duplicate</option></select>
        </label>
      </div>
      <label>Notes<textarea name="notes" placeholder="Customer needs, objections, expected next step"></textarea></label>
      <button class="button" type="submit">Save Qualification</button>
    </form>
    <section class="section table-wrap">
      <table>
        <thead><tr><th>Customer</th><th>Budget</th><th>Loan</th><th>Location</th><th>Flat Type</th><th>Timeline</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </div></div>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
