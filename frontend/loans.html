<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skyline CRM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="loans" data-title="Loan Processing">
  <div id="shell"><div id="page">
    <div class="page-header"><div><h1>Loan Processing</h1><p class="subtle">Track bank details, loan amount, EMI, sanction date, and processing status.</p></div></div>
    <form class="form" id="loan-form" data-endpoint="loans" data-redirect="loans.html">
      <input type="hidden" name="id">
      <div class="form-grid">
        <label>Customer Name<input name="customer" required></label>
        <label>Booking ID<input name="bookingId"></label>
        <label>Bank Name<input name="bankName"></label>
        <label>Loan Amount<input name="loanAmount"></label>
        <label>EMI<input name="emi"></label>
        <label>Sanction Date<input name="sanctionDate" type="date"></label>
        <label>Application Date<input name="applicationDate" type="date" data-default="today"></label>
        <label>Verification Date<input name="verificationDate" type="date"></label>
        <label>Status<select name="status"><option>NOT_APPLIED</option><option>LOAN_APPLIED</option><option>BANK_VERIFICATION</option><option>APPROVED</option><option>REJECTED</option><option>DISBURSED</option></select></label>
      </div>
      <label>Remarks<textarea name="remarks"></textarea></label>
      <button class="button" type="submit">Save Loan</button>
    </form>
    <section class="section table-wrap"><table><thead><tr><th>Customer</th><th>Bank</th><th>Loan Amount</th><th>EMI</th><th>Sanction Date</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></section>
  </div></div>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
