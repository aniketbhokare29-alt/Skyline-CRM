<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skyline CRM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="vendor-payments" data-title="Vendor Payments">
  <div id="shell"><div id="page">
    <div class="page-header"><div><h1>Vendor Payments</h1><p class="subtle">Record payment mode, transaction number, bank, paid amount, and balance.</p></div></div>
    <section class="grid cards" id="cards"></section>
    <form class="form section" id="vendor-payment-form" data-endpoint="vendor-payments" data-redirect="vendor-payments.html">
      <input type="hidden" name="id">
      <div class="form-grid">
        <label>Vendor Name<input name="vendorName" required></label>
        <label>Payment Date<input name="paymentDate" type="date" data-default="today"></label>
        <label>Payment Mode<select name="paymentMode"><option>Bank Transfer</option><option>Cash</option><option>UPI</option><option>Cheque</option></select></label>
        <label>UTR / Transaction Number<input name="transactionNumber"></label>
        <label>Bank<input name="bank"></label>
        <label>Paid Amount<input name="paidAmount"></label>
        <label>Balance Amount<input name="balanceAmount"></label>
        <label>Status<select name="status"><option>Pending</option><option>Partially Paid</option><option>Fully Paid</option><option>Overdue</option></select></label>
      </div>
      <button class="button" type="submit">Save Payment</button>
    </form>
    <section class="section table-wrap"><table><thead><tr><th>Vendor</th><th>Date</th><th>Mode</th><th>Transaction</th><th>Paid</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></section>
  </div></div>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
