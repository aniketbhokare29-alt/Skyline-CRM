<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skyline CRM</title>
  <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body data-page="create-agent" data-title="Create Agent">
  <div id="shell"><div id="page">
    <div class="page-header">
      <div><h1>Create Agent</h1><p class="subtle">Add an agent profile to Skyline CRM.</p></div>
    </div>
    <section class="section">
      <h2>Agent Information</h2>
      <form class="form" data-endpoint="create-agent" data-redirect="dashboard.html" data-success="Agent created successfully.">
        <div class="form-grid">
          <label>Agent ID <span class="subtle">(optional)</span><input name="agentId" placeholder="AGT-001"></label>
          <label>Full Name<input name="name" required></label>
          <label>Mobile Number<input name="mobile" type="tel" required></label>
          <label>Email Address<input name="email" type="email" required></label>
          <label>Role<input name="role" value="AGENT" readonly></label>
          <label>Created Date<input name="createdDate" type="date" required></label>
        </div>
        <button class="button" type="submit">Create Agent</button>
      </form>
    </section>
  </div></div>
  <script src="js/api.js?v=6"></script>
  <script src="js/ui.js?v=6"></script>
  <script src="js/pages.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
