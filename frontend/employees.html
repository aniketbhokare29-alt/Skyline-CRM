<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skyline CRM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="employees" data-title="Employees">
  <div id="shell"><div id="page">
    <div class="page-header"><div><h1>Employees</h1><p class="subtle">Maintain employee master details, salary structure, bank details, PAN, Aadhaar, PF, and ESIC.</p></div></div>
    <form class="form" id="employee-form" data-endpoint="employees" data-redirect="employees.html">
      <input type="hidden" name="id">
      <div class="form-grid">
        <label>Employee ID<input name="employeeId" required></label>
        <label>Employee Name<input name="name" required></label>
        <label>Department<input name="department" placeholder="Sales, Accounts, HR"></label>
        <label>Designation<input name="designation"></label>
        <label>Mobile Number<input name="mobile"></label>
        <label>Email<input name="email" type="email"></label>
        <label>Date of Joining<input name="dateOfJoining" type="date"></label>
        <label>Salary Structure<input name="salaryStructure" placeholder="Basic + HRA + Incentive"></label>
        <label>Bank Account Details<input name="bankDetails"></label>
        <label>PAN & Aadhaar<input name="identityDetails"></label>
        <label>PF / ESIC Details<input name="statutoryDetails"></label>
      </div>
      <button class="button" type="submit">Save Employee</button>
    </form>
    <section class="section table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Department</th><th>Designation</th><th>Contact</th><th>Joining</th><th>Salary Structure</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></section>
  </div></div>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
